<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Metrics — Time in Columns</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #2d3748;
      padding: 24px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 30px;
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.07);
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #4a5568; }
    .chart-wrap { position: relative; height: 380px; }
    .meta { font-size: 13px; color: #718096; line-height: 2; }
    .meta strong { color: #4a5568; }
    .tag {
      display: inline-block; background: #ebf4ff; color: #2b6cb0;
      border-radius: 4px; padding: 2px 8px; font-size: 12px; margin-right: 4px;
    }
    details.warnings { margin-top: 12px; }
    details.warnings summary {
      font-size: 13px; color: #c53030; cursor: pointer; font-weight: 600;
    }
    details.warnings ul {
      margin-top: 8px; padding-left: 20px;
      font-size: 12px; color: #742a2a; line-height: 1.9;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Flow Metrics — Time in Columns</h1>
    <p id="subtitle"></p>
  </div>

  <div class="card">
    <h2>Total time spent in each in-progress column (days, summed across all items in window)</h2>
    <div class="chart-wrap">
      <canvas id="timeInColumnsChart"></canvas>
    </div>
  </div>

  <div class="card meta" id="metaCard"></div>

</div>
<script>
const data = /*DATA_PLACEHOLDER*/;

document.getElementById('subtitle').textContent =
  'Window: ' + data.window.start.slice(0, 10) + ' → ' + data.window.end.slice(0, 10) +
  ' (' + data.window.parameter + ')' +
  '  |  Items with activity in window: ' + data.item_count +
  '  |  Generated: ' + new Date(data.calculated_at).toLocaleString('en-GB');

const cols = data.columns.filter(c => c.column_type === 'inProgress');
const labels = cols.map(c => c.name);
const totals = cols.map(c => Math.round(c.total_hours / 24 * 10) / 10);

new Chart(document.getElementById('timeInColumnsChart'), {
  type: 'bar',
  data: {
    labels,
    datasets: [
      {
        label: 'Total time (days)',
        data: totals,
        backgroundColor: 'rgba(102, 126, 234, 0.75)',
        borderColor: 'rgba(102, 126, 234, 1)',
        borderWidth: 1,
        borderRadius: 4,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          afterBody: (items) => {
            const col = cols[items[0].dataIndex];
            return ['n = ' + col.n + ' items'];
          }
        }
      }
    },
    scales: {
      x: { grid: { display: false } },
      y: {
        title: { display: true, text: 'Days' },
        beginAtZero: true
      }
    }
  }
});

// Meta card
const metaEl = document.getElementById('metaCard');
const colMapping = data.config_used.historical_column_mapping;
const mappingEntries = Object.entries(colMapping);
const mappingHtml = mappingEntries.length > 0
  ? mappingEntries.map(([k, v]) => '<span class="tag">' + k + ' → ' + (v ?? 'excluded') + '</span>').join('')
  : '<em>none</em>';

let warningsHtml = '';
if (data.warnings.length > 0) {
  const items = data.warnings.map(w => '<li>' + w.replace(/</g, '&lt;') + '</li>').join('');
  warningsHtml =
    '<details class="warnings"><summary>' +
    data.warnings.length + ' warning' + (data.warnings.length !== 1 ? 's' : '') +
    '</summary><ul>' + items + '</ul></details>';
}

metaEl.innerHTML =
  '<strong>Source files:</strong> ' + data.source_files.map(f => f.replace(/\\/g, '/')).join(', ') + '<br>' +
  '<strong>Excluded items:</strong> ' + (data.excluded_item_ids.length > 0 ? data.excluded_item_ids.join(', ') : 'none') + '<br>' +
  '<strong>Historical column mapping applied:</strong> ' + mappingHtml +
  warningsHtml;
</script>
</body>
</html>
