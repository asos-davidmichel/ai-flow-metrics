<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Metrics — Time in Columns</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #2d3748;
      padding: 24px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 30px;
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.07);
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 0; color: #4a5568; }
    .chart-wrap { position: relative; height: 380px; }
    .meta { font-size: 13px; color: #718096; line-height: 2; }
    .meta strong { color: #4a5568; }
    .tag {
      display: inline-block; background: #ebf4ff; color: #2b6cb0;
      border-radius: 4px; padding: 2px 8px; font-size: 12px; margin-right: 4px;
    }
    details.warnings { margin-top: 12px; }
    details.warnings summary {
      font-size: 13px; color: #c53030; cursor: pointer; font-weight: 600;
    }
    details.warnings ul {
      margin-top: 8px; padding-left: 20px;
      font-size: 12px; color: #742a2a; line-height: 1.9;
    }
    .chart-tooltip {
      position: absolute;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
      max-height: 380px;
      overflow-y: auto;
      z-index: 100;
      min-width: 300px;
      max-width: 420px;
      pointer-events: auto;
      font-size: 13px;
      display: none;
    }
    .tt-title {
      font-weight: 700; font-size: 14px; color: #2d3748;
      margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
    }
    .tt-bottleneck {
      background: #fed7aa; color: #c05621;
      font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .tt-total { color: #718096; font-size: 12px; margin-bottom: 10px; }
    .tt-items { display: flex; flex-direction: column; gap: 4px; }
    .tt-item {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #f7fafc;
    }
    .tt-badge {
      color: white; font-size: 10px; font-weight: 700;
      padding: 2px 5px; border-radius: 3px; white-space: nowrap;
    }
    .tt-link {
      color: #667eea; text-decoration: none;
      font-weight: 600; font-family: monospace; font-size: 12px; white-space: nowrap;
    }
    .tt-link:hover { text-decoration: underline; color: #764ba2; }
    .tt-item-title {
      color: #4a5568; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-size: 12px;
    }
    .tt-item-days { color: #718096; font-size: 11px; white-space: nowrap; font-weight: 600; }
    .tt-hint { margin-top: 10px; font-size: 11px; color: #a0aec0; font-style: italic; text-align: center; }
    .ref-legend { display: flex; gap: 14px; font-size: 11px; margin-top: 8px; flex-wrap: wrap; }
    .ref-legend-item { display: flex; align-items: center; gap: 5px; color: #718096; }
    .ref-legend-line { width: 22px; height: 0; border-top: 2px dashed; }
    .type-toggles {
      display: none;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .type-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 2px solid transparent;
      background: #f0f2f5;
      color: #718096;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      opacity: 0.45;
    }
    .type-toggle.active {
      border-color: var(--type-color, #667eea);
      background: white;
      color: #2d3748;
      opacity: 1;
    }
    .type-toggle:hover { opacity: 0.75; }
    .type-toggle.active:hover { opacity: 0.9; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Flow Metrics — Time in Columns</h1>
    <p id="subtitle"></p>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Total time spent in each in-progress column</h2>
      <div id="typeToggles" class="type-toggles"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="timeInColumnsChart"></canvas>
    </div>
  </div>

  <!-- Cycle time charts (shown if data is available) -->
  <div id="cycleTimeSection" style="display:none;">
    <div class="card">
      <div class="card-header">
        <div>
          <h2>Cycle time &mdash; scatter</h2>
          <p class="card-subtitle" id="ctSubtitle"></p>
          <div class="ref-legend">
            <span class="ref-legend-item"><span class="ref-legend-line" style="border-color:#667eea"></span>Mean</span>
            <span class="ref-legend-item"><span class="ref-legend-line" style="border-color:#48bb78"></span>P50</span>
            <span class="ref-legend-item"><span class="ref-legend-line" style="border-color:#ed8936"></span>P85</span>
          </div>
        </div>
        <div id="ctToggles" class="type-toggles"></div>
      </div>
      <div class="chart-wrap" style="height:400px;">
        <canvas id="ctScatterChart"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>Cycle time &mdash; weekly average &amp; trend</h2>
      </div>
      <div class="chart-wrap">
        <canvas id="ctRollingChart"></canvas>
      </div>
    </div>
  </div>

  <div class="card meta" id="metaCard"></div>

</div>
<div id="chartTooltip" class="chart-tooltip"></div>
<div id="ctTooltip" class="chart-tooltip"></div>
<script>
const dashboard = /*DASHBOARD_DATA_PLACEHOLDER*/;
const data = dashboard.time_in_columns;

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.getElementById('subtitle').textContent =
  'Window: ' + data.window.start.slice(0, 10) + ' → ' + data.window.end.slice(0, 10) +
  ' (' + data.window.parameter + ')' +
  '  |  Items with activity in window: ' + data.item_count +
  '  |  Generated: ' + new Date(data.calculated_at).toLocaleString('en-GB');

const cols = data.columns.filter(c => c.column_type === 'inProgress');
const labels = cols.map(c => c.name);
const typeStyles = data.work_item_type_styles || {};
const allTypes = Object.keys(typeStyles);
const activeTypes = new Set(allTypes);

// --- Type toggles (only rendered when there are multiple types) ---
const toggleContainer = document.getElementById('typeToggles');
if (allTypes.length > 1) {
  toggleContainer.style.display = 'flex';
  allTypes.forEach(type => {
    const style = typeStyles[type];
    const btn = document.createElement('button');
    btn.className = 'type-toggle active';
    btn.dataset.type = type;
    btn.style.setProperty('--type-color', style.color);

    const iconHtml = style.icon_url
      ? `<img src="${escapeHtml(style.icon_url)}" width="14" height="14" style="vertical-align:middle;" onerror="this.style.display='none'">`
      : `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${escapeHtml(style.color)};flex-shrink:0;"></span>`;
    btn.innerHTML = iconHtml + ' ' + escapeHtml(type);

    btn.addEventListener('click', () => {
      if (activeTypes.has(type)) {
        if (activeTypes.size === 1) return; // always keep at least one active
        activeTypes.delete(type);
        btn.classList.remove('active');
      } else {
        activeTypes.add(type);
        btn.classList.add('active');
      }
      updateChart();
    });

    toggleContainer.appendChild(btn);
  });
}

// --- Filtered data helpers ---
function filteredColData() {
  return cols.map(col => {
    const items = (col.items || []).filter(item => activeTypes.has(item.type));
    const totalHours = items.reduce((sum, item) => sum + item.hours, 0);
    return { col, items, totalHours, n: items.length };
  });
}

function computeColors(filtered) {
  const maxHours = Math.max(...filtered.map(f => f.totalHours));
  const bg = filtered.map(f =>
    f.totalHours > 0 && f.totalHours === maxHours
      ? 'rgba(237, 100, 66, 0.85)' : 'rgba(102, 126, 234, 0.75)'
  );
  const border = filtered.map(f =>
    f.totalHours > 0 && f.totalHours === maxHours
      ? 'rgba(200, 60, 20, 1)' : 'rgba(102, 126, 234, 1)'
  );
  return { bg, border, maxHours };
}

// --- External HTML tooltip ---
const tooltipEl = document.getElementById('chartTooltip');
let tooltipFrozen = false;
let currentFiltered = filteredColData();

tooltipEl.addEventListener('mouseenter', () => { tooltipFrozen = true; });
tooltipEl.addEventListener('mouseleave', () => {
  tooltipFrozen = false;
  tooltipEl.style.display = 'none';
});

function buildTooltip(colIndex) {
  const fd = currentFiltered[colIndex];
  const totalDays = Math.round(fd.totalHours / 24 * 10) / 10;
  const maxHours = Math.max(...currentFiltered.map(f => f.totalHours));
  const isMax = fd.totalHours > 0 && fd.totalHours === maxHours;

  let html = `<div class="tt-title">${escapeHtml(fd.col.name)}${
    isMax ? ' <span class="tt-bottleneck">bottleneck</span>' : ''}</div>`;
  html += `<div class="tt-total">${totalDays} days total &middot; ${fd.n} items</div>`;
  html += '<div class="tt-items">';
  fd.items.forEach(item => {
    const style = typeStyles[item.type] || { color: '#718096', abbr: String(item.type || '?').slice(0, 4) };
    const url = data.ado_url_base + '/' + item.id;
    const days = Math.round(item.hours / 24 * 10) / 10;
    const iconHtml = style.icon_url
      ? `<img src="${escapeHtml(style.icon_url)}" width="14" height="14" style="vertical-align:middle;border-radius:2px;" onerror="this.style.display='none'">`
      : `<span class="tt-badge" style="background:${escapeHtml(style.color)}">${escapeHtml(style.abbr)}</span>`;
    html += `<div class="tt-item">
      ${iconHtml}
      <a class="tt-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">#${item.id}</a>
      <span class="tt-item-title">${escapeHtml(item.title)}</span>
      <span class="tt-item-days">${days}d</span>
    </div>`;
  });
  html += '</div>';
  if (fd.items.length > 0) {
    html += '<div class="tt-hint">Hover to keep open &middot; click to open in ADO</div>';
  }
  return html;
}

function externalTooltip(context) {
  const { tooltip } = context;
  if (tooltip.opacity === 0) {
    if (!tooltipFrozen) tooltipEl.style.display = 'none';
    return;
  }
  const colIndex = tooltip.dataPoints[0].dataIndex;
  tooltipEl.innerHTML = buildTooltip(colIndex);
  tooltipEl.style.display = 'block';

  const rect = context.chart.canvas.getBoundingClientRect();
  let left = rect.left + window.pageXOffset + tooltip.caretX + 16;
  const top = rect.top + window.pageYOffset + tooltip.caretY;
  if (left + 440 > window.innerWidth + window.pageXOffset) {
    left = rect.left + window.pageXOffset + tooltip.caretX - 440;
  }
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

// --- Chart ---
const initFiltered = filteredColData();
currentFiltered = initFiltered;
const initColors = computeColors(initFiltered);

const chart = new Chart(document.getElementById('timeInColumnsChart'), {
  type: 'bar',
  data: {
    labels,
    datasets: [{
      label: 'Total time (days)',
      data: initFiltered.map(f => Math.round(f.totalHours / 24 * 10) / 10),
      backgroundColor: initColors.bg,
      borderColor: initColors.border,
      borderWidth: 1,
      borderRadius: 4,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false, external: externalTooltip }
    },
    scales: {
      x: { grid: { display: false } },
      y: { title: { display: true, text: 'Days' }, beginAtZero: true }
    }
  }
});

function updateChart() {
  tooltipEl.style.display = 'none';
  tooltipFrozen = false;
  currentFiltered = filteredColData();
  const colors = computeColors(currentFiltered);
  chart.data.datasets[0].data = currentFiltered.map(f => Math.round(f.totalHours / 24 * 10) / 10);
  chart.data.datasets[0].backgroundColor = colors.bg;
  chart.data.datasets[0].borderColor = colors.border;
  chart.update();
}

// Meta card
const metaEl = document.getElementById('metaCard');
const colMapping = data.config_used.historical_column_mapping;
const mappingEntries = Object.entries(colMapping);
const mappingHtml = mappingEntries.length > 0
  ? mappingEntries.map(([k, v]) => '<span class="tag">' + escapeHtml(k) + ' → ' + escapeHtml(v ?? 'excluded') + '</span>').join('')
  : '<em>none</em>';

let warningsHtml = '';
if (data.warnings.length > 0) {
  const items = data.warnings.map(w => '<li>' + escapeHtml(w) + '</li>').join('');
  warningsHtml =
    '<details class="warnings"><summary>' +
    data.warnings.length + ' warning' + (data.warnings.length !== 1 ? 's' : '') +
    '</summary><ul>' + items + '</ul></details>';
}

metaEl.innerHTML =
  '<strong>Source files:</strong> ' + data.source_files.map(f => escapeHtml(f.replace(/\\/g, '/'))).join(', ') + '<br>' +
  '<strong>Excluded items:</strong> ' + (data.excluded_item_ids.length > 0 ? data.excluded_item_ids.join(', ') : 'none') + '<br>' +
  '<strong>Historical column mapping applied:</strong> ' + mappingHtml +
  warningsHtml;

// ====================================================================
// Cycle time charts
// ====================================================================
(function () {
  const ct = dashboard.cycle_time;
  if (!ct || !ct.items || ct.items.length === 0) return;

  document.getElementById('cycleTimeSection').style.display = '';

  const ctItems = ct.items;
  const ctTypeStyles = ct.work_item_type_styles || {};
  const ctAllTypes = Object.keys(ctTypeStyles);
  const ctActiveTypes = new Set(ctAllTypes);

  // Window boundaries (shared x-axis for both charts)
  const windowStartMs = new Date(ct.window.start).getTime();
  const windowEndMs   = new Date(ct.window.end).getTime();

  // Summary subtitle
  const ov = ct.overall || {};
  if (ov.n) {
    document.getElementById('ctSubtitle').textContent =
      ov.n + ' items \u00b7 Median: ' + ov.median_days + 'd \u00b7 P85: ' + ov.p85_days + 'd';
  }

  // --- Type toggles ---
  const ctToggleContainer = document.getElementById('ctToggles');
  if (ctAllTypes.length > 1) {
    ctToggleContainer.style.display = 'flex';
    ctAllTypes.forEach(type => {
      const style = ctTypeStyles[type] || { color: '#718096' };
      const btn = document.createElement('button');
      btn.className = 'type-toggle active';
      btn.style.setProperty('--type-color', style.color);
      const iconHtml = style.icon_url
        ? `<img src="${escapeHtml(style.icon_url)}" width="14" height="14" style="vertical-align:middle;" onerror="this.style.display='none'">`
        : `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${escapeHtml(style.color)};flex-shrink:0;"></span>`;
      btn.innerHTML = iconHtml + ' ' + escapeHtml(type);
      btn.addEventListener('click', () => {
        if (ctActiveTypes.has(type)) {
          if (ctActiveTypes.size === 1) return;
          ctActiveTypes.delete(type);
          btn.classList.remove('active');
        } else {
          ctActiveTypes.add(type);
          btn.classList.add('active');
        }
        updateCtCharts();
      });
      ctToggleContainer.appendChild(btn);
    });
  }

  // --- Scatter data, pre-grouped by type ---
  const ctDataByType = {};
  ctAllTypes.forEach(type => {
    ctDataByType[type] = ctItems
      .filter(i => i.type === type)
      .map(i => ({ x: new Date(i.completed_at).getTime(), y: i.cycle_time_days, _item: i }));
  });

  // --- Stats helpers ---
  function computeStats(items) {
    if (!items.length) return null;
    const times = items.map(i => i.cycle_time_days).sort((a, b) => a - b);
    const mean = times.reduce((s, v) => s + v, 0) / times.length;
    const p50 = times[Math.floor(times.length * 0.5)];
    const p85 = times[Math.min(Math.floor(times.length * 0.85), times.length - 1)];
    return {
      mean: Math.round(mean * 10) / 10,
      p50: Math.round(p50 * 10) / 10,
      p85: Math.round(p85 * 10) / 10,
    };
  }

  function refLineDatasets(items) {
    const stats = computeStats(items);
    if (!stats) return [];
    return [
      { label: 'Mean', _ref: true, data: [{ x: windowStartMs, y: stats.mean }, { x: windowEndMs, y: stats.mean }], showLine: true, pointRadius: 0, borderColor: '#667eea', borderWidth: 1.5, borderDash: [4, 4], fill: false },
      { label: 'P50',  _ref: true, data: [{ x: windowStartMs, y: stats.p50  }, { x: windowEndMs, y: stats.p50  }], showLine: true, pointRadius: 0, borderColor: '#48bb78', borderWidth: 1.5, borderDash: [4, 4], fill: false },
      { label: 'P85',  _ref: true, data: [{ x: windowStartMs, y: stats.p85  }, { x: windowEndMs, y: stats.p85  }], showLine: true, pointRadius: 0, borderColor: '#ed8936', borderWidth: 1.5, borderDash: [4, 4], fill: false },
    ];
  }

  function fmtMs(ms) {
    return new Date(ms).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
  }

  // --- External tooltip for scatter ---
  const ctTooltipEl = document.getElementById('ctTooltip');
  let ctTooltipFrozen = false;
  ctTooltipEl.addEventListener('mouseenter', () => { ctTooltipFrozen = true; });
  ctTooltipEl.addEventListener('mouseleave', () => { ctTooltipFrozen = false; ctTooltipEl.style.display = 'none'; });

  function buildCtTooltip(item) {
    const style = ctTypeStyles[item.type] || { color: '#718096', abbr: String(item.type || '?').slice(0, 4) };
    const url = ct.ado_url_base + '/' + item.id;
    const days = item.cycle_time_days;
    const completed = new Date(item.completed_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    const iconHtml = style.icon_url
      ? `<img src="${escapeHtml(style.icon_url)}" width="14" height="14" style="vertical-align:middle;border-radius:2px;" onerror="this.style.display='none'">`
      : `<span class="tt-badge" style="background:${escapeHtml(style.color)}">${escapeHtml(style.abbr)}</span>`;
    const title = item.title.length > 55 ? item.title.slice(0, 55) + '\u2026' : item.title;
    return (
      `<div class="tt-total">Completed: ${escapeHtml(completed)}</div>` +
      '<div class="tt-items"><div class="tt-item">' +
      iconHtml +
      `<a class="tt-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">#${item.id}</a>` +
      `<span class="tt-item-title">${escapeHtml(title)}</span>` +
      `<span class="tt-item-days">${days}d</span>` +
      '</div></div>' +
      '<div class="tt-hint">Hover to keep open \u00b7 click to open in ADO</div>'
    );
  }

  function ctExternalTooltip(context) {
    const { tooltip } = context;
    if (tooltip.opacity === 0) {
      if (!ctTooltipFrozen) ctTooltipEl.style.display = 'none';
      return;
    }
    const raw = tooltip.dataPoints[0].raw;
    if (!raw._item) return; // reference line — no tooltip
    ctTooltipEl.innerHTML = buildCtTooltip(raw._item);
    ctTooltipEl.style.display = 'block';
    const rect = context.chart.canvas.getBoundingClientRect();
    let left = rect.left + window.pageXOffset + tooltip.caretX + 16;
    const top = rect.top + window.pageYOffset + tooltip.caretY;
    if (left + 440 > window.innerWidth + window.pageXOffset) {
      left = rect.left + window.pageXOffset + tooltip.caretX - 440;
    }
    ctTooltipEl.style.left = left + 'px';
    ctTooltipEl.style.top = top + 'px';
  }

  // --- Scatter chart ---
  const activeItemsForRef = () => ctItems.filter(i => ctActiveTypes.has(i.type));

  const scatterChart = new Chart(document.getElementById('ctScatterChart'), {
    type: 'scatter',
    data: {
      datasets: [
        ...ctAllTypes.map(type => {
          const style = ctTypeStyles[type] || { color: '#718096' };
          return {
            label: type,
            data: ctDataByType[type],
            backgroundColor: style.color + 'bb',
            borderColor: style.color,
            borderWidth: 1.5,
            pointRadius: 6,
            pointHoverRadius: 9,
          };
        }),
        ...refLineDatasets(ctItems),
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: ctExternalTooltip },
      },
      scales: {
        x: {
          type: 'linear',
          min: windowStartMs,
          max: windowEndMs,
          title: { display: true, text: 'Completion date' },
          ticks: { maxTicksLimit: 8, callback: val => fmtMs(val) },
          grid: { display: false },
        },
        y: { title: { display: true, text: 'Cycle time (days)' }, beginAtZero: true },
      },
    },
  });

  // --- Rolling average chart ---
  // Pre-generate all Mondays in the window so both charts share the same range
  function allWeeksInWindow() {
    const weeks = [];
    const cur = new Date(windowStartMs);
    const day = cur.getUTCDay();
    cur.setUTCDate(cur.getUTCDate() + (day === 0 ? -6 : 1 - day)); // snap to Monday
    const end = new Date(windowEndMs);
    while (cur <= end) {
      weeks.push(cur.toISOString().slice(0, 10));
      cur.setUTCDate(cur.getUTCDate() + 7);
    }
    return weeks;
  }

  function weekStart(isoStr) {
    const d = new Date(isoStr);
    const day = d.getUTCDay();
    const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(d);
    mon.setUTCDate(d.getUTCDate() + diff);
    return mon.toISOString().slice(0, 10);
  }

  function computeWeekly(items) {
    const buckets = {};
    items.forEach(item => {
      const w = weekStart(item.completed_at);
      (buckets[w] = buckets[w] || []).push(item.cycle_time_days);
    });
    return allWeeksInWindow().map(w => ({
      week_start: w,
      n: (buckets[w] || []).length,
      mean_days: buckets[w]
        ? Math.round(buckets[w].reduce((s, v) => s + v, 0) / buckets[w].length * 10) / 10
        : null,
    }));
  }

  function weekLabel(isoDate) {
    return new Date(isoDate).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
  }

  function linRegIndexed(weekly) {
    const valid = weekly.map((w, i) => ({ x: i, y: w.mean_days })).filter(p => p.y !== null);
    const n = valid.length;
    if (n < 2) return null;
    const meanX = valid.reduce((s, p) => s + p.x, 0) / n;
    const meanY = valid.reduce((s, p) => s + p.y, 0) / n;
    const num = valid.reduce((s, p) => s + (p.x - meanX) * (p.y - meanY), 0);
    const den = valid.reduce((s, p) => s + (p.x - meanX) ** 2, 0);
    if (!den) return null;
    const slope = num / den, intercept = meanY - slope * meanX;
    const firstI = valid[0].x, lastI = valid[valid.length - 1].x;
    return (i) => (i < firstI || i > lastI) ? null : Math.round(Math.max(0, slope * i + intercept) * 10) / 10;
  }

  function weeklyToChart(weekly) {
    const means = weekly.map(w => w.mean_days);
    const predict = linRegIndexed(weekly);
    return {
      labels: weekly.map(w => weekLabel(w.week_start)),
      means,
      trend: weekly.map((_, i) => predict ? predict(i) : null),
    };
  }

  let currentWeekly = computeWeekly(ctItems);
  const initRolling = weeklyToChart(currentWeekly);

  // --- External tooltip for rolling chart (reuses ctTooltipEl) ---
  function rollingExternalTooltip(context) {
    const { tooltip } = context;
    if (tooltip.opacity === 0) {
      if (!ctTooltipFrozen) ctTooltipEl.style.display = 'none';
      return;
    }
    // Only show tooltip for the weekly average dataset (index 0), not trend line
    const dp = tooltip.dataPoints[0];
    if (dp.datasetIndex !== 0 || dp.parsed.y === null) {
      if (!ctTooltipFrozen) ctTooltipEl.style.display = 'none';
      return;
    }
    const w = currentWeekly[dp.dataIndex];
    if (!w || w.mean_days === null) return;
    ctTooltipEl.innerHTML =
      `<div class="tt-title">Week of ${escapeHtml(weekLabel(w.week_start))}</div>` +
      `<div class="tt-total">Mean: ${w.mean_days}d &middot; ${w.n} item${w.n !== 1 ? 's' : ''}</div>`;
    ctTooltipEl.style.display = 'block';
    const rect = context.chart.canvas.getBoundingClientRect();
    let left = rect.left + window.pageXOffset + tooltip.caretX + 16;
    const top = rect.top + window.pageYOffset + tooltip.caretY;
    if (left + 440 > window.innerWidth + window.pageXOffset) {
      left = rect.left + window.pageXOffset + tooltip.caretX - 440;
    }
    ctTooltipEl.style.left = left + 'px';
    ctTooltipEl.style.top = top + 'px';
  }

  const rollingChart = new Chart(document.getElementById('ctRollingChart'), {
    type: 'line',
    data: {
      labels: initRolling.labels,
      datasets: [
        {
          label: 'Weekly average',
          data: initRolling.means,
          borderColor: '#667eea',
          backgroundColor: '#667eea',
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: false,
          tension: 0.3,
          spanGaps: true,
        },
        {
          label: 'Trend',
          data: initRolling.trend,
          borderColor: 'rgba(200,60,20,0.7)',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          tension: 0,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: rollingExternalTooltip },
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 10, maxRotation: 45 } },
        y: { title: { display: true, text: 'Cycle time (days)' }, beginAtZero: true },
      },
    },
  });

  // --- Update both charts on type toggle ---
  function updateCtCharts() {
    // Scatter: show/hide per-type datasets, rebuild reference lines
    ctAllTypes.forEach((type, idx) => {
      scatterChart.setDatasetVisibility(idx, ctActiveTypes.has(type));
    });
    scatterChart.data.datasets.splice(ctAllTypes.length); // remove old ref lines
    refLineDatasets(activeItemsForRef()).forEach(ds => scatterChart.data.datasets.push(ds));
    scatterChart.update();

    // Rolling: recompute from filtered items
    currentWeekly = computeWeekly(activeItemsForRef());
    const rolling = weeklyToChart(currentWeekly);
    rollingChart.data.labels = rolling.labels;
    rollingChart.data.datasets[0].data = rolling.means;
    rollingChart.data.datasets[1].data = rolling.trend;
    rollingChart.update();
  }
})();
</script>
</body>
</html>
