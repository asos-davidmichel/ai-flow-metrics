<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Metrics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #2d3748;
      padding: 24px 32px;
    }
    .container { max-width: none; }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 30px;
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.07);
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 0; color: #4a5568; }
    .chart-wrap { position: relative; height: 380px; }
    .meta { font-size: 13px; color: #718096; line-height: 2; }
    .meta strong { color: #4a5568; }
    .tag {
      display: inline-block; background: #ebf4ff; color: #2b6cb0;
      border-radius: 4px; padding: 2px 8px; font-size: 12px; margin-right: 4px;
    }
    details.warnings { margin-top: 12px; }
    details.warnings summary {
      font-size: 13px; color: #c53030; cursor: pointer; font-weight: 600;
    }
    details.warnings ul {
      margin-top: 8px; padding-left: 20px;
      font-size: 12px; color: #742a2a; line-height: 1.9;
    }
    .chart-tooltip {
      position: absolute;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
      max-height: 380px;
      overflow-y: auto;
      z-index: 100;
      min-width: 300px;
      max-width: 420px;
      pointer-events: auto;
      font-size: 13px;
      display: none;
    }
    .tt-title {
      font-weight: 700; font-size: 14px; color: #2d3748;
      margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
    }
    .tt-bottleneck {
      background: #fed7aa; color: #c05621;
      font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .tt-total { color: #718096; font-size: 12px; margin-bottom: 10px; }
    .tt-items { display: flex; flex-direction: column; gap: 4px; }
    .tt-item {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #f7fafc;
    }
    .tt-badge {
      color: white; font-size: 10px; font-weight: 700;
      padding: 2px 5px; border-radius: 3px; white-space: nowrap;
    }
    .tt-link {
      color: #667eea; text-decoration: none;
      font-weight: 600; font-family: monospace; font-size: 12px; white-space: nowrap;
    }
    .tt-link:hover { text-decoration: underline; color: #764ba2; }
    .tt-item-title {
      color: #4a5568; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-size: 12px;
    }
    .tt-item-days { color: #718096; font-size: 11px; white-space: nowrap; font-weight: 600; }
    .tt-hint { margin-top: 10px; font-size: 11px; color: #a0aec0; font-style: italic; text-align: center; }
    .ref-legend { display: flex; gap: 14px; font-size: 11px; margin-top: 8px; flex-wrap: wrap; }
    .ref-legend-item { display: flex; align-items: center; gap: 5px; color: #718096; }
    .ref-legend-line { width: 22px; height: 0; border-top: 2px dashed; }
    .type-toggles {
      display: none;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .type-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 2px solid transparent;
      background: #f0f2f5;
      color: #718096;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      opacity: 0.45;
    }
    .type-toggle.active {
      border-color: var(--type-color, #667eea);
      background: white;
      color: #2d3748;
      opacity: 1;
    }
    .type-toggle:hover { opacity: 0.75; }
    .type-toggle.active:hover { opacity: 0.9; }

    /* KPI overview cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.07);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #a0aec0;
    }
    .kpi-value {
      font-size: 36px;
      font-weight: 700;
      color: #2d3748;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .kpi-unit { font-size: 16px; font-weight: 400; color: #718096; }
    .kpi-trend {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .kpi-trend.positive { background: #c6f6d5; color: #276749; }
    .kpi-trend.negative { background: #fed7d7; color: #9b2c2c; }
    .kpi-trend.neutral  { background: #e2e8f0; color: #4a5568; }
    .kpi-sub { font-size: 12px; color: #718096; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      padding: 6px;
      background: #edf2f7;
      border-radius: 12px;
      width: fit-content;
    }
    .tab-btn {
      padding: 9px 22px;
      border: none;
      background: transparent;
      font: 600 14px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #718096;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.6); color: #4a5568; }
    .tab-btn.active {
      background: white;
      color: #667eea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Side-by-side card rows */
    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    .card-row .card { margin-bottom: 0; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Flow Metrics</h1>
    <div id="headerMeta" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;font-size:13px;opacity:0.88;">
      <span id="hTeam"></span>
      <span id="hBoard"></span>
      <span id="hWindow"></span>

  <div class="tabs">

  <div id="tab-delivery" class="tab-panel">

    <!-- Throughput: full width -->

      <div class="card">

            <div><h2>Lead time &mdash; scatter</h2></div>
            <div id="ltToggles" class="type-toggles"></div>
          </div>
          <div class="chart-wrap" style="height:340px;">
            <canvas id="ltScatterChart"></canvas>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Lead time &mdash; weekly average &amp; trend</h2>
            <div id="ltTogglesRolling" class="type-toggles"></div>
          </div>

  </div><!-- /tab-delivery -->

  <!-- ── Process tab ──────────────────────────────────────────────── -->

    <div class="card">
      <div class="card-header">
        <h2>Total time spent in each in-progress column</h2>
        <div id="typeToggles" class="type-toggles"></div>
      </div>
      <div class="chart-wrap">
        <canvas id="timeInColumnsChart"></canvas>
      </div>
    </div>

</div>
<div id="sharedTooltip" class="chart-tooltip"></div>
<script>
const dashboard = /*DASHBOARD_DATA_PLACEHOLDER*/;
const data = dashboard.time_in_columns;

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Header metadata ─────────────────────────────────────────────────
(function () {
  const ctx = dashboard.context;
  const ct  = dashboard.cycle_time;
  function metaChip(label, value) {
    return `<span style="display:inline-flex;align-items:center;gap:5px;">`
      + `<span style="opacity:0.7;font-weight:500;">${label}:</span>`
      + `<span style="font-weight:700;">${escapeHtml(String(value))}</span></span>`;
  }
  if (ctx) {
    if (ctx.team)         document.getElementById('hTeam').innerHTML  = metaChip('Team', ctx.team);
    if (ctx.board?.name)  document.getElementById('hBoard').innerHTML = metaChip('Board', ctx.board.name);
  }
  if (ct?.window) {
    const fmt = iso => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    document.getElementById('hWindow').innerHTML = metaChip('Window', fmt(ct.window.start) + ' – ' + fmt(ct.window.end));
  }
  if (ct?.calculated_at) {
    const d = new Date(ct.calculated_at);
    const label = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
                + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('hGeneratedAt').innerHTML = metaChip('Generated', label);
  }
})();
// ────────────────────────────────────────────────────────────────────

// ── Shared tooltip ──────────────────────────────────────────────────
// Single element, single frozen state, single positioning helper.
// Usage in any Chart.js external tooltip handler:
//   if (tooltip.opacity === 0) { sharedTooltip.hide(); return; }
//   sharedTooltip.show(htmlString, context);
const sharedTooltip = (() => {
  const el = document.getElementById('sharedTooltip');
  let frozen = false;
  let hideTimer = null;
  el.addEventListener('mouseenter', () => { frozen = true; clearTimeout(hideTimer); });
  el.addEventListener('mouseleave', () => { frozen = false; el.style.display = 'none'; });
  function position(context) {
    const { tooltip } = context;
    const rect = context.chart.canvas.getBoundingClientRect();
    let left = rect.left + window.pageXOffset + tooltip.caretX + 16;
    const top  = rect.top  + window.pageYOffset + tooltip.caretY;
    if (left + 440 > window.innerWidth + window.pageXOffset) {
      left = rect.left + window.pageXOffset + tooltip.caretX - 440;
    }
    el.style.left = left + 'px';
    el.style.top  = top  + 'px';
  }
  return {
    show(html, context) { clearTimeout(hideTimer); el.innerHTML = html; el.style.display = 'block'; position(context); },
    hide()              { if (frozen) return; clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (!frozen) el.style.display = 'none'; }, 150); },
    reset()             { frozen = false; clearTimeout(hideTimer); el.style.display = 'none'; },
  };
})();
// ────────────────────────────────────────────────────────────────────

// ── Shared tooltip item helpers ──────────────────────────────────────
// Change item row appearance here and it applies to every chart tooltip.
function ttIcon(style) {
  return style.icon_url
    ? `<img src="${escapeHtml(style.icon_url)}" width="14" height="14" style="vertical-align:middle;border-radius:2px;" onerror="this.style.display='none'">`
    : `<span class="tt-badge" style="background:${escapeHtml(style.color)}">${escapeHtml(style.abbr)}</span>`;
}
function ttItemRow(style, url, id, title, days) {
  const short = title.length > 55 ? title.slice(0, 55) + '\u2026' : title;
  return '<div class="tt-item">' +
    ttIcon(style) +
    `<a class="tt-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">#${id}</a>` +
    `<span class="tt-item-title">${escapeHtml(short)}</span>` +
    `<span class="tt-item-days">${days}d</span>` +
    '</div>';
}
const TT_HINT = '<div class="tt-hint">Hover to keep open &middot; click to open in ADO</div>';
// ────────────────────────────────────────────────────────────────────

// ── Shared date / week helpers ───────────────────────────────────────
function fmtMs(ms) {
  return new Date(ms).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
}
function weekStart(isoStr) {
  const d = new Date(isoStr);
  const day = d.getUTCDay();
  const mon = new Date(d);
  mon.setUTCDate(d.getUTCDate() + (day === 0 ? -6 : 1 - day));
  return mon.toISOString().slice(0, 10);
}
function weeksInRange(items) {
  if (!items.length) return [];
  const ws = items.map(i => weekStart(i.completed_at));
  const first = ws.reduce((a, b) => a < b ? a : b);
  const last  = ws.reduce((a, b) => a > b ? a : b);
  const result = [];
  const cur = new Date(first + 'T00:00:00Z');
  const end = new Date(last  + 'T00:00:00Z');
  while (cur <= end) { result.push(cur.toISOString().slice(0, 10)); cur.setUTCDate(cur.getUTCDate() + 7); }
  return result;
}
function weekLabel(isoDate) {
  return new Date(isoDate).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
}
// weeklyToChart: takes a weekly array with {mean_days, mean_completed_ms, _week}
// and returns {means, trend} datasets for a linear-time-axis Chart.js line chart.
function weeklyToChart(weekly) {
  // linear regression over non-null weeks
  const valid = weekly.filter(w => w.mean_days !== null && w.mean_completed_ms !== null)
    .map(w => ({ x: w.mean_completed_ms, y: w.mean_days }));
  let predict = null;
  if (valid.length >= 2) {
    const n = valid.length;
    const meanX = valid.reduce((s, p) => s + p.x, 0) / n;
    const meanY = valid.reduce((s, p) => s + p.y, 0) / n;
    const num = valid.reduce((s, p) => s + (p.x - meanX) * (p.y - meanY), 0);
    const den = valid.reduce((s, p) => s + (p.x - meanX) ** 2, 0);
    if (den) {
      const slope = num / den, intercept = meanY - slope * meanX;
      const firstX = valid[0].x, lastX = valid[valid.length - 1].x;
      predict = x => (x < firstX || x > lastX) ? null
        : Math.round(Math.max(0, slope * x + intercept) * 10) / 10;
    }
  }
  const means = weekly
    .filter(w => w.mean_days !== null && w.mean_completed_ms !== null)
    .map(w => ({ x: w.mean_completed_ms, y: w.mean_days, _week: w }));
  const trend = weekly
    .filter(w => w.mean_completed_ms !== null)
    .map(w => { const y = predict ? predict(w.mean_completed_ms) : null; return y !== null ? { x: w.mean_completed_ms, y } : null; })
    .filter(p => p !== null);
  return { means, trend };
}
// ── Shared chart plugins ───────────────────────────────────────────────
// Draws coloured badge labels at the right edge of reference lines (_ref datasets).
const refLabelPlugin = {
  id: 'refLabels',
  afterDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!scales.y || !chartArea) return;
    const labelMap = { Mean: 'Avg', P50: 'Median', P85: '85th' };
    chart.data.datasets.forEach(ds => {
      if (!ds._ref || !ds.data.length) return;
      const val = ds.data[0].y;
      if (val == null) return;
      const yPx = scales.y.getPixelForValue(val);
      const prefix = labelMap[ds.label] || ds.label;
      const text = `${prefix}: ${val}d`;
      ctx.save();
      ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      const textW = ctx.measureText(text).width;
      const padX = 7, bh = 20;
      const bw = textW + padX * 2;
      const bx = chartArea.right - bw - 4;
      const by = yPx - bh / 2;
      const r = 4;
      ctx.fillStyle = ds.borderColor;
      ctx.beginPath();
      ctx.moveTo(bx + r, by); ctx.lineTo(bx + bw - r, by);
      ctx.arcTo(bx + bw, by, bx + bw, by + r, r);
      ctx.lineTo(bx + bw, by + bh - r);
      ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
      ctx.lineTo(bx + r, by + bh);
      ctx.arcTo(bx, by + bh, bx, by + bh - r, r);
      ctx.lineTo(bx, by + r);
      ctx.arcTo(bx, by, bx + r, by, r);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, bx + bw / 2, yPx);
      ctx.restore();
    });
  }
};
// ────────────────────────────────────────────────────────────────────
  'Window: ' + data.window.start.slice(0, 10) + ' → ' + data.window.end.slice(0, 10) +
  ' (' + data.window.parameter + ')' +
  '  |  Items with activity in window: ' + data.item_count +
  '  |  Generated: ' + new Date(data.calculated_at).toLocaleString('en-GB');

const cols = data.columns.filter(c => c.column_type === 'inProgress');
const labels = cols.map(c => c.name);
const typeStyles = data.work_item_type_styles || {};
const allTypes = Object.keys(typeStyles);
const activeTypes = new Set(allTypes);

// --- Type toggles (only rendered when there are multiple types) ---
const toggleContainer = document.getElementById('typeToggles');
if (allTypes.length > 1) {
  toggleContainer.style.display = 'flex';
  allTypes.forEach(type => {
    const style = typeStyles[type];
    const btn = document.createElement('button');
    btn.className = 'type-toggle active';
    btn.dataset.type = type;
    btn.style.setProperty('--type-color', style.color);

    const iconHtml = style.icon_url
      ? `<img src="${escapeHtml(style.icon_url)}" width="14" height="14" style="vertical-align:middle;" onerror="this.style.display='none'">`
      : `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${escapeHtml(style.color)};flex-shrink:0;"></span>`;
    btn.innerHTML = iconHtml + ' ' + escapeHtml(type);

    btn.addEventListener('click', () => {
      if (activeTypes.has(type)) {
        if (activeTypes.size === 1) return; // always keep at least one active
        activeTypes.delete(type);
        btn.classList.remove('active');
      } else {
        activeTypes.add(type);
        btn.classList.add('active');
      }
      updateChart();
    });

    toggleContainer.appendChild(btn);
  });
}

// --- Filtered data helpers ---
function filteredColData() {
  return cols.map(col => {
    const items = (col.items || []).filter(item => activeTypes.has(item.type));
    const totalHours = items.reduce((sum, item) => sum + item.hours, 0);
    return { col, items, totalHours, n: items.length };
  });
}

function computeColors(filtered) {
  const maxHours = Math.max(...filtered.map(f => f.totalHours));
  const bg = filtered.map(f =>
    f.totalHours > 0 && f.totalHours === maxHours
      ? 'rgba(237, 100, 66, 0.85)' : 'rgba(102, 126, 234, 0.75)'
  );
  const border = filtered.map(f =>
    f.totalHours > 0 && f.totalHours === maxHours
      ? 'rgba(200, 60, 20, 1)' : 'rgba(102, 126, 234, 1)'
  );
  return { bg, border, maxHours };
}

let currentFiltered = filteredColData();

function buildTooltip(colIndex) {
  const fd = currentFiltered[colIndex];
  const totalDays = Math.round(fd.totalHours / 24 * 10) / 10;
  const maxHours = Math.max(...currentFiltered.map(f => f.totalHours));
  const isMax = fd.totalHours > 0 && fd.totalHours === maxHours;
  let html =
    `<div class="tt-title">${escapeHtml(fd.col.name)}${isMax ? ' <span class="tt-bottleneck">bottleneck</span>' : ''}</div>` +
    `<div class="tt-total">${totalDays} days total &middot; ${fd.n} items</div>` +
    '<div class="tt-items">';
  fd.items.forEach(item => {
    const style = typeStyles[item.type] || { color: '#718096', abbr: String(item.type || '?').slice(0, 4) };
    html += ttItemRow(style, data.ado_url_base + '/' + item.id, item.id, item.title, Math.round(item.hours / 24 * 10) / 10);
  });
  html += '</div>';

// ====================================================================
// Throughput chart (items completed per week, derived from cycle_time)
// ====================================================================
(function () {
  const ct = dashboard.cycle_time;
  if (!ct || !ct.items || ct.items.length === 0) return;

  document.getElementById('throughputSection').style.display = '';

  // Build weekly counts over the same data range as cycle time
  const allItems = ct.items;
  const _tpMs  = allItems.map(i => new Date(i.completed_at).getTime());
  const _tpPad = 7 * 24 * 3600 * 1000;
  const tpMinMs = Math.min(..._tpMs) - _tpPad;
  const tpMaxMs = Math.max(..._tpMs) + _tpPad;

  function tpComputeWeekly(items) {
    const buckets = {};
    items.forEach(item => {
      const w = weekStart(item.completed_at);
      (buckets[w] = buckets[w] || []).push(item);
    });
    return weeksInRange(items).map(w => {
      const its = buckets[w];
      if (!its) return { week_start: w, n: 0, mean_completed_ms: null, items: [] };
      const meanMs = its.reduce((s, i) => s + new Date(i.completed_at).getTime(), 0) / its.length;
      return { week_start: w, n: its.length, mean_completed_ms: meanMs, items: its };
    });
  }

  const tpWeekly = tpComputeWeekly(allItems);

  // Linear regression on counts
  function tpLinReg(weekly) {
    const valid = weekly.filter(w => w.mean_completed_ms !== null).map(w => ({ x: w.mean_completed_ms, y: w.n }));
    const n = valid.length;
    if (n < 2) return null;
    const meanX = valid.reduce((s, p) => s + p.x, 0) / n;
    const meanY = valid.reduce((s, p) => s + p.y, 0) / n;
    const num = valid.reduce((s, p) => s + (p.x - meanX) * (p.y - meanY), 0);
    const den = valid.reduce((s, p) => s + (p.x - meanX) ** 2, 0);
    if (!den) return null;
    const slope = num / den, intercept = meanY - slope * meanX;
    const firstX = valid[0].x, lastX = valid[valid.length - 1].x;
    return x => (x < firstX || x > lastX) ? null : Math.round(Math.max(0, slope * x + intercept) * 10) / 10;
  }

  const tpPredict = tpLinReg(tpWeekly);
  const tpCounts = tpWeekly.filter(w => w.mean_completed_ms !== null).map(w => ({ x: w.mean_completed_ms, y: w.n, _week: w }));
  const tpTrend  = tpWeekly.filter(w => w.mean_completed_ms !== null).map(w => {
    const y = tpPredict ? tpPredict(w.mean_completed_ms) : null;
    return y !== null ? { x: w.mean_completed_ms, y } : null;
  }).filter(p => p !== null);

  function tpTooltip(context) {
    if (context.tooltip.opacity === 0) { sharedTooltip.hide(); return; }
    const dp = context.tooltip.dataPoints[0];
    if (dp.datasetIndex !== 0) { sharedTooltip.hide(); return; }
    const w = dp.raw._week;
    if (!w) { sharedTooltip.hide(); return; }
    const typeStyles = ct.work_item_type_styles || {};
    let html =
      `<div class="tt-title">Week of ${escapeHtml(weekLabel(w.week_start))}</div>` +
      `<div class="tt-total">${w.n} item${w.n !== 1 ? 's' : ''} completed</div>` +
      '<div class="tt-items">';
    (w.items || []).forEach(item => {
      const style = typeStyles[item.type] || { color: '#718096', abbr: String(item.type || '?').slice(0,4) };
      html += ttItemRow(style, ct.ado_url_base + '/' + item.id, item.id, item.title, item.cycle_time_days);
    });
    html += '</div>' + TT_HINT;
    sharedTooltip.show(html, context);
  }

  new Chart(document.getElementById('throughputChart'), {
    type: 'line',
    data: {
      datasets: [
        { label: 'Items / week', data: tpCounts, borderColor: '#48bb78', backgroundColor: '#48bb78', borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, fill: false, tension: 0.3, spanGaps: false },
        { label: 'Trend',       data: tpTrend,  borderColor: 'rgba(200,60,20,0.7)', borderWidth: 2, borderDash: [6,4], pointRadius: 0, fill: false, tension: 0, spanGaps: false },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'point', intersect: true },
      plugins: { legend: { display: false }, tooltip: { enabled: false, external: tpTooltip } },
      scales: {
        x: { type: 'linear', min: tpMinMs, max: tpMaxMs, grid: { display: false }, ticks: { maxTicksLimit: 10, maxRotation: 45, callback: val => fmtMs(val) } },
        y: { title: { display: true, text: 'Items completed' }, beginAtZero: true, ticks: { stepSize: 1 } },
      },
    },
  });
})();

// ── Overview KPI cards ───────────────────────────────────────────────
(function () {
  const ct  = dashboard.cycle_time;
  const lt  = dashboard.lead_time;
  const tic = dashboard.time_in_columns;

  // Linear regression slope using timestamps as X — identical approach to weeklyToChart()
  // so the sign always matches what the chart's trend line shows.
  // Returns slope in days-per-week (normalised from days-per-ms) so thresholds are meaningful.
  const MS_PER_WEEK = 7 * 24 * 3600 * 1000;
  function weeklyTrend(weeklyStats, field) {
    const pts = (weeklyStats || []).filter(w => w[field] != null && w.n > 0)
      .map(w => ({ x: new Date(w.week_start + 'T00:00:00Z').getTime(), y: w[field] }));
    if (pts.length < 2) return null;
    const n = pts.length;
    const meanX = pts.reduce((s, p) => s + p.x, 0) / n;
    const meanY = pts.reduce((s, p) => s + p.y, 0) / n;
    const num = pts.reduce((s, p) => s + (p.x - meanX) * (p.y - meanY), 0);
    const den = pts.reduce((s, p) => s + (p.x - meanX) ** 2, 0);
    const slopePerMs = den ? num / den : 0;
    return slopePerMs * MS_PER_WEEK; // convert to days-per-week
  }

  function arrow(slope) { return slope > 0 ? '↑' : slope < 0 ? '↓' : '→'; }

  function trendClass(slope, positiveIsDown) {
    if (Math.abs(slope) < 0.1) return 'neutral';
    const goingDown = slope < 0;
    return (positiveIsDown ? goingDown : !goingDown) ? 'positive' : 'negative';
  }

  function makeTrendBadge(slope, positiveIsDown) {
    if (slope === null) return '';
    const cls = trendClass(slope, positiveIsDown);
    const label = slope > 0.1 ? 'Trending up' : slope < -0.1 ? 'Trending down' : 'Stable';
    return `<span class="kpi-trend ${cls}">${arrow(slope)} ${label}</span>`;
  }

  function kpiCard(label, valueHtml, trendHtml, subHtml) {
    return `<div class="kpi-card">`
      + `<div class="kpi-label">${label}</div>`
      + `<div class="kpi-value">${valueHtml}</div>`
      + (trendHtml ? trendHtml : '')
      + (subHtml ? `<div class="kpi-sub">${subHtml}</div>` : '')
      + `</div>`;
  }

  const cards = [];

  // ── Throughput ──
  if (ct) {
    // Build weekly counts from ct.items
    const buckets = {};
    (ct.items || []).forEach(i => {
      const w = weekStart(i.completed_at);
      buckets[w] = (buckets[w] || 0) + 1;
    });
    const weeks = Object.keys(buckets).sort();
    const weeklyTp = weeks.map(w => ({ week_start: w, n: buckets[w], mean_days: buckets[w] }));
    const slope  = weeklyTrend(weeklyTp, 'mean_days');
    const avgAll = weeks.length ? Math.round(ct.items.length / weeks.length * 10) / 10 : 0;
    cards.push(kpiCard(
      'Throughput',
      `${avgAll}<span class="kpi-unit">items/wk</span>`,
      makeTrendBadge(slope, false),
      `${ct.items.length} items completed over ${weeks.length} weeks`
    ));
  }

  // ── Cycle time ──
  if (ct) {
    const slope  = weeklyTrend(ct.weekly_stats, 'mean_days');
    const val = Math.round(ct.overall.mean_days);
    const sub = `Median ${Math.round(ct.overall.median_days)}d &middot; P85 ${Math.round(ct.overall.p85_days)}d`;
    cards.push(kpiCard(
      'Cycle time',
      `${val}<span class="kpi-unit">days</span>`,
      makeTrendBadge(slope, true),
      sub
    ));
  }

  // ── Lead time ──
  if (lt) {
    const slope  = weeklyTrend(lt.weekly_stats, 'mean_days');
    const val = Math.round(lt.overall.mean_days);
    const sub = `Median ${Math.round(lt.overall.median_days)}d &middot; P85 ${Math.round(lt.overall.p85_days)}d`;
    cards.push(kpiCard(
      'Lead time',
      `${val}<span class="kpi-unit">days</span>`,
      makeTrendBadge(slope, true),
      sub
    ));
  }

  // ── Bottleneck ──
  if (tic) {
    const inProgress = (tic.columns || []).filter(c => c.column_type === 'inProgress' && c.total_hours > 0);
    if (inProgress.length) {
      const bottleneck = inProgress.reduce((a, b) => b.total_hours > a.total_hours ? b : a);
      const avgTotal = inProgress.reduce((s, c) => s + c.total_hours, 0) / inProgress.length;
      const ratio = Math.round(bottleneck.total_hours / avgTotal * 10) / 10;
      const avgDays = Math.round(bottleneck.mean_hours / 24 * 10) / 10;
      const badge = ratio >= 2
        ? `<span class="kpi-trend negative">⚠ ${ratio}× avg column</span>`
        : `<span class="kpi-trend neutral">${ratio}× avg column</span>`;
      cards.push(kpiCard(
        'Bottleneck',
        `<span style="font-size:22px;font-weight:700;color:#2d3748;">${escapeHtml(bottleneck.name)}</span>`,
        badge,
        `Avg ${avgDays}d per item &middot; ${ratio}× the column average`
      ));
    }
  }

  document.getElementById('kpiGrid').innerHTML = cards.join('');
})();
// ────────────────────────────────────────────────────────────────────

// ── Tab switching ────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    sharedTooltip.reset();
  });
});
</script>
</body>
